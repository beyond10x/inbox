[workspace]
resolver = "3"
members = ["crates/*", "tests/acceptance"]
exclude = ["generated/rust"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/inbox"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
