[package]
name = "inbox-cli"
description = "The `inbox` binary: the HTTP service on a loopback address, and the client that signs, posts, reads, answers, refuses, collects, waits and reposts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "inbox"
path = "src/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
clap = { workspace = true, features = ["env"] }
getrandom = "0.4"
inbox = { path = "../../generated/rust/inbox", features = ["server"] }
inbox-core = { path = "../inbox-core" }
inbox-server = { path = "../inbox-server" }
inbox-verify = { path = "../inbox-verify" }
libc = "0.2"
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }
signal-hook = "0.4"
zeroize = "1.8"

[lints]
workspace = true
