name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: inbox / task check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install go-task
        env:
          TASK_VERSION: "3.54.0"
          TASK_SHA256: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install ess
        env:
          ESS_VERSION: "0.96.0"
          ESS_SHA256: 8eaf33989c9306bd923d19a96be82723addf7ad532b534fb8b0e423733f81825
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Install Rust
        env:
          RUST_VERSION: "1.99.1"
          RUST_DIST: "2026-10-15"
          RUSTC_SHA256: 2ff05ff9c08a90861e7f6e4065b40a8b87463b4576186fd613871c3e37f2091f
          RUST_STD_SHA256: 109b074225bf5b9ea3820890876bfdf4ed161adbfaf94b2b4b5984c85ee5d958
          CARGO_SHA256: 53f3521949404d595efb06a55c12c5658d4ed1c75566f33d3d514eaebe70bd8a
          CLIPPY_SHA256: 458339712a058e52cc4522ff9ef8b59cd1ea1340312216cd94194c464a3f6dc5
          RUSTFMT_SHA256: e3b36c4c7ec3486c059d8067ff48787676612007123aad7a4e8ec12c48ee9ba2
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          prefix="$RUNNER_TEMP/rust-$RUST_VERSION"
          cd "$RUNNER_TEMP"
          install_component() {
            local name="$1-$RUST_VERSION-$target"
            curl --fail --silent --show-error --location --output "$name.tar.xz" \
              "https://static.rust-lang.org/dist/$RUST_DIST/$name.tar.xz"
            echo "$2  $name.tar.xz" | sha256sum --check --strict
            tar -xJf "$name.tar.xz"
            "./$name/install.sh" --prefix="$prefix" --disable-ldconfig
          }
          install_component rustc "$RUSTC_SHA256"
          install_component rust-std "$RUST_STD_SHA256"
          install_component cargo "$CARGO_SHA256"
          install_component clippy "$CLIPPY_SHA256"
          install_component rustfmt "$RUSTFMT_SHA256"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/rustc" --version | grep -F "rustc $RUST_VERSION "

      - name: task check
        run: task check
