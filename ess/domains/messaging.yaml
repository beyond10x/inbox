  - name: inbox.messaging.InboxClosed
    fields:
      - {name: address, type: inbox.messaging.Address}
  - name: inbox.messaging.MessagePosted
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: to, type: inbox.messaging.Address}
      - {name: from, type: inbox.messaging.Principal}
      - {name: thread, type: inbox.messaging.ThreadId}
      - {name: kind, type: inbox.messaging.Kind}
  - name: inbox.messaging.MessageDelivered
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
  - name: inbox.messaging.MessageRead
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
  - name: inbox.messaging.MessageHandled
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
  - name: inbox.messaging.MessageAnswered
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: reply_id, type: inbox.messaging.MessageId}
      - {name: to, type: inbox.messaging.Principal}
      - {name: thread, type: inbox.messaging.ThreadId}
  - name: inbox.messaging.MessageRefused
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: to, type: inbox.messaging.Principal}
      - {name: thread, type: inbox.messaging.ThreadId}
  - name: inbox.messaging.DecisionTakenOnSilence
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: to, type: inbox.messaging.Principal}
      - {name: thread, type: inbox.messaging.ThreadId}
  - name: inbox.messaging.MessageExpired
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: to, type: inbox.messaging.Principal}
      - {name: thread, type: inbox.messaging.ThreadId}

views:
  - name: inbox.messaging.Inboxes
    source: inbox.messaging.Inbox
    consistency: read_your_writes
    fields:
      - {name: address, type: inbox.messaging.Address}
      - {name: owner, type: inbox.messaging.Principal}
      - {name: adapter, type: inbox.messaging.Adapter}
      - {name: state, type: inbox.messaging.Inbox.State}
    naming:
      wire: inboxes
      display: Inboxes

  - name: inbox.messaging.Pending
    source: inbox.messaging.Message
    consistency: read_your_writes
    params: [{name: inbox, type: inbox.messaging.Address}]
    filter: {all: [to == param.inbox, {any: [state == Sent, state == Delivered]}]}
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: from, type: inbox.messaging.Principal}
      - {name: on_behalf_of, type: inbox.messaging.Principal}
      - {name: authority, type: Optional<inbox.messaging.DelegationId>}
      - {name: to, type: inbox.messaging.Address}
      - {name: kind, type: inbox.messaging.Kind}
      - {name: thread, type: inbox.messaging.ThreadId}
      - {name: reply_shape, type: Optional<inbox.messaging.ReplyShape>}
      - {name: decision, type: Optional<inbox.messaging.DecisionAsk>}
      - {name: default_on_silence, type: Optional<inbox.messaging.OptionLetter>}
      - {name: created, type: Timestamp}
      - {name: expires, type: Timestamp}
      - {name: dedup_key, type: inbox.messaging.DedupKey}
      - {name: body, type: inbox.messaging.Body}
      - {name: signature, type: inbox.messaging.Signature}
      - {name: state, type: inbox.messaging.Message.State}
    naming:
      wire: pending
      display: Pending
      summary: "What an inbox holds that its owner has not read: the read a wake surface makes. `inbox wait` is this read held open until it has a row whose `expires` has not passed, or the wait ends; it then answers every row, those past their `expires` included."

  - name: inbox.messaging.Unanswered
    source: inbox.messaging.Message
    consistency: read_your_writes
    params: [{name: inbox, type: inbox.messaging.Address}]
    filter: {all: [to == param.inbox, state == Read]}
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: from, type: inbox.messaging.Principal}
      - {name: on_behalf_of, type: inbox.messaging.Principal}
      - {name: authority, type: Optional<inbox.messaging.DelegationId>}
      - {name: to, type: inbox.messaging.Address}
      - {name: kind, type: inbox.messaging.Kind}
      - {name: thread, type: inbox.messaging.ThreadId}
      - {name: reply_shape, type: Optional<inbox.messaging.ReplyShape>}
      - {name: decision, type: Optional<inbox.messaging.DecisionAsk>}
      - {name: default_on_silence, type: Optional<inbox.messaging.OptionLetter>}
      - {name: created, type: Timestamp}
      - {name: expires, type: Timestamp}
      - {name: dedup_key, type: inbox.messaging.DedupKey}
      - {name: body, type: inbox.messaging.Body}
      - {name: signature, type: inbox.messaging.Signature}
      - {name: state, type: inbox.messaging.Message.State}
    naming:
      wire: unanswered
      display: Unanswered
      summary: "The requests and decisions the owner of an inbox has read and not answered."

  - name: inbox.messaging.Outbox
    source: inbox.messaging.Message
    consistency: read_your_writes
    params: [{name: sender, type: inbox.messaging.Principal}]
    filter: from == param.sender
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: from, type: inbox.messaging.Principal}
      - {name: on_behalf_of, type: inbox.messaging.Principal}
      - {name: authority, type: Optional<inbox.messaging.DelegationId>}
      - {name: to, type: inbox.messaging.Address}
      - {name: kind, type: inbox.messaging.Kind}
      - {name: thread, type: inbox.messaging.ThreadId}
      - {name: reply_shape, type: Optional<inbox.messaging.ReplyShape>}
      - {name: decision, type: Optional<inbox.messaging.DecisionAsk>}
      - {name: default_on_silence, type: Optional<inbox.messaging.OptionLetter>}
      - {name: created, type: Timestamp}
      - {name: expires, type: Timestamp}
      - {name: dedup_key, type: inbox.messaging.DedupKey}
      - {name: body, type: inbox.messaging.Body}
      - {name: signature, type: inbox.messaging.Signature}
      - {name: answered_by, type: Optional<inbox.messaging.AnsweredBy>}
      - {name: decided_option, type: Optional<inbox.messaging.OptionLetter>}
      - {name: reply, type: Optional<inbox.messaging.Reply>}
      - {name: refusal, type: Optional<String>}
      - {name: state, type: inbox.messaging.Message.State}
    naming:
      wire: outbox
      display: Outbox
      summary: "Every live message a principal sent, in whatever state."

  - name: inbox.messaging.Settled
    source: inbox.messaging.Message
    consistency: read_your_writes
    params: [{name: sender, type: inbox.messaging.Principal}]
    filter: {all: [from == param.sender, {any: [state == Answered, state == Refused]}]}
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: from, type: inbox.messaging.Principal}
      - {name: on_behalf_of, type: inbox.messaging.Principal}
      - {name: authority, type: Optional<inbox.messaging.DelegationId>}
      - {name: to, type: inbox.messaging.Address}
      - {name: kind, type: inbox.messaging.Kind}
      - {name: thread, type: inbox.messaging.ThreadId}
      - {name: reply_shape, type: Optional<inbox.messaging.ReplyShape>}
      - {name: decision, type: Optional<inbox.messaging.DecisionAsk>}
      - {name: default_on_silence, type: Optional<inbox.messaging.OptionLetter>}
      - {name: created, type: Timestamp}
      - {name: expires, type: Timestamp}
      - {name: dedup_key, type: inbox.messaging.DedupKey}
      - {name: body, type: inbox.messaging.Body}
      - {name: signature, type: inbox.messaging.Signature}
      - {name: answered_by, type: Optional<inbox.messaging.AnsweredBy>}
      - {name: decided_option, type: Optional<inbox.messaging.OptionLetter>}
      - {name: reply, type: Optional<inbox.messaging.Reply>}
      - {name: refusal, type: Optional<String>}
      - {name: state, type: inbox.messaging.Message.State}
    naming:
      wire: settled
      display: Settled
      summary: "The messages of a sender that carry an answer or a refusal to collect."

  - name: inbox.messaging.Thread
    source: inbox.messaging.Message
    consistency: read_your_writes
    params: [{name: thread, type: inbox.messaging.ThreadId}]
    filter: thread == param.thread
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: from, type: inbox.messaging.Principal}
      - {name: on_behalf_of, type: inbox.messaging.Principal}
      - {name: authority, type: Optional<inbox.messaging.DelegationId>}
      - {name: to, type: inbox.messaging.Address}
      - {name: kind, type: inbox.messaging.Kind}
      - {name: thread, type: inbox.messaging.ThreadId}
      - {name: reply_shape, type: Optional<inbox.messaging.ReplyShape>}
      - {name: decision, type: Optional<inbox.messaging.DecisionAsk>}
      - {name: default_on_silence, type: Optional<inbox.messaging.OptionLetter>}
      - {name: created, type: Timestamp}
      - {name: expires, type: Timestamp}
      - {name: dedup_key, type: inbox.messaging.DedupKey}
      - {name: body, type: inbox.messaging.Body}
      - {name: signature, type: inbox.messaging.Signature}
      - {name: answered_by, type: Optional<inbox.messaging.AnsweredBy>}
      - {name: decided_option, type: Optional<inbox.messaging.OptionLetter>}
      - {name: reply, type: Optional<inbox.messaging.Reply>}
      - {name: refusal, type: Optional<String>}
      - {name: state, type: inbox.messaging.Message.State}
    naming:
      wire: thread
      display: Thread
      summary: "Every live message of one thread: one row per recipient of a fan-out, with its state."

  - name: inbox.messaging.Replies
    source: inbox.messaging.Message
    consistency: read_your_writes
    params: [{name: thread, type: inbox.messaging.ThreadId}]
    filter: {all: [thread == param.thread, state == Answered]}
    fields:
      - {name: message_id, type: inbox.messaging.MessageId}
      - {name: from, type: inbox.messaging.Principal}
