type: ess-scenario/7
domain: inbox.messaging
scenario: a-second-expired-reply-to-an-answered-request-is-already-settled
summary: 'A second answer to an answered request, whose own `expires` lies before the service''s clock, is
  `already-settled`: a reply''s own deadline is checked only while the message is open.'
timeline:
- at: '2019-12-01T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    address: agent:box/worker
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: agent:box/worker
- at: '2019-12-01T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0DY000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: request
    thread: 01JGT0DY000000000000000001
    reply_shape:
      shape: lines
      value: 1
    created: '2019-12-01T09:00:00Z'
    expires: '2020-01-05T10:00:00Z'
    dedup_key: 01JGT0DY000000000000000001
    body: Is build 512 green?
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0DY000000000000000001
      to: agent:box/worker
      from: agent:ws/planner
      thread: 01JGT0DY000000000000000001
      kind: request
- at: '2019-12-01T09:02:00Z'
  command: inbox.messaging.MarkRead
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    message_id: 01JGT0DY000000000000000001
  outcome: read
  events:
  - event: inbox.messaging.MessageRead
    payload:
      message_id: 01JGT0DY000000000000000001
- at: '2019-12-01T09:30:00Z'
  command: inbox.messaging.Answer
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    in_reply_to: 01JGT0DY000000000000000001
    reply_id: 01JGT0DY000000000000000002
    from: agent:box/worker
    on_behalf_of: agent:box/worker
    created: '2019-12-01T09:10:00Z'
    expires: '2020-01-04T09:10:00Z'
    body: Green.
    signature:
      key_id: key-2
      value: c2lnbmF0dXJl
  outcome: answered
  events:
  - event: inbox.messaging.MessageAnswered
    payload:
      message_id: 01JGT0DY000000000000000001
      reply_id: 01JGT0DY000000000000000002
      to: agent:ws/planner
      thread: 01JGT0DY000000000000000001
- at: '2019-12-02T09:45:00Z'
  command: inbox.messaging.Answer
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    in_reply_to: 01JGT0DY000000000000000001
    reply_id: 01JGT0DY000000000000000003
    from: agent:box/worker
    on_behalf_of: agent:box/worker
    created: '2019-12-01T09:40:00Z'
    expires: '2019-12-02T09:40:00Z'
    body: Red.
    signature:
      key_id: key-2
      value: c2lnbmF0dXJl
  outcome: already-settled
  error:
    name: inbox.messaging.AlreadySettled
  no_events:
  - inbox.messaging.MessageAnswered
assert:
- view: inbox.messaging.Settled
  params:
    sender: agent:ws/planner
  contains:
    message_id: 01JGT0DY000000000000000001
    state: Answered
    expires: '2020-01-04T09:10:00Z'
