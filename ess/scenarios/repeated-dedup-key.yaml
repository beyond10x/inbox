type: ess-scenario/7
covers:
- inbox.messaging.PostMessage/outcome/duplicate-key
domain: inbox.messaging
scenario: repeated-dedup-key
summary: A second envelope with another id and the dedup key of a live message is refused as a duplicate
  and stores nothing.
timeline:
- at: '2026-01-05T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    address: agent:box/worker
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: agent:box/worker
- at: '2026-01-05T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0DK000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: note
    thread: 01JGT0DK000000000000000001
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: deploy-42
    body: Build 512 is green.
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0DK000000000000000001
      to: agent:box/worker
      from: agent:ws/planner
      thread: 01JGT0DK000000000000000001
      kind: note
- at: '2026-01-05T09:02:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0DK000000000000000002
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: note
    thread: 01JGT0DK000000000000000002
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: deploy-42
    body: Build 512 is green.
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: duplicate-key
  error:
    name: inbox.messaging.Duplicate
  no_events:
  - inbox.messaging.MessagePosted
assert:
- view: inbox.messaging.Pending
  params:
    inbox: agent:box/worker
  counts:
    at_least: 1
    at_most: 1
- view: inbox.messaging.Pending
  params:
    inbox: agent:box/worker
  contains:
    message_id: 01JGT0DK000000000000000001
    dedup_key: deploy-42
- view: inbox.messaging.Outbox
  params:
    sender: agent:ws/planner
  excludes:
    message_id: 01JGT0DK000000000000000002
