type: ess-scenario/7
covers:
- inbox.messaging.PostMessage/outcome/duplicate
domain: inbox.messaging
scenario: repost-after-restart-arrives-once
summary: A restarted service holds nothing, as at the start of a scenario. The owner opens its inbox again
  and the sender reposts; a second repost of the id is a duplicate, so the message arrives once.
timeline:
- at: '2026-01-05T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    address: agent:box/worker
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: agent:box/worker
- at: '2026-01-05T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0RR000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: request
    thread: 01JGT0RR000000000000000001
    reply_shape: &id001
      shape: lines
      value: 3
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: 01JGT0RR000000000000000001
    body: Build 512 is green.
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0RR000000000000000001
      to: agent:box/worker
      from: agent:ws/planner
      thread: 01JGT0RR000000000000000001
      kind: request
- at: '2026-01-05T09:02:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0RR000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: request
    thread: 01JGT0RR000000000000000001
    reply_shape: *id001
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: 01JGT0RR000000000000000001
    body: Build 512 is green.
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: duplicate
  error:
    name: inbox.messaging.Duplicate
  no_events:
  - inbox.messaging.MessagePosted
assert:
- view: inbox.messaging.Pending
  params:
    inbox: agent:box/worker
  counts:
    at_least: 1
    at_most: 1
- view: inbox.messaging.Outbox
  params:
    sender: agent:ws/planner
  counts:
    at_least: 1
    at_most: 1
