type: ess-scenario/7
covers:
- inbox.messaging.Answer/outcome/not-recipient
- inbox.messaging.Collect/outcome/not-sender
- inbox.messaging.MarkDelivered/outcome/not-recipient
- inbox.messaging.MarkRead/outcome/not-recipient
- inbox.messaging.OpenInbox/outcome/not-owner
- inbox.messaging.Refuse/outcome/not-recipient
domain: inbox.messaging
scenario: only-the-owner-handles-its-inbox
summary: Only the owner of an inbox marks, reads, answers or refuses its messages and opens or closes
  it, and only the sender collects. The sender, the owner or another caller is refused and nothing moves.
