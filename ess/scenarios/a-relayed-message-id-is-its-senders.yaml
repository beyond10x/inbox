type: ess-scenario/7
domain: inbox.messaging
scenario: a-relayed-message-id-is-its-senders
summary: 'A delegate posts for the operator and reposts: duplicate. The operator posts under that id as
  itself: id-taken, the id is the delegate''s message, not the operator''s. Nothing more is stored.'
timeline:
- at: '2026-01-05T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    address: agent:box/worker
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: agent:box/worker
- at: '2026-01-05T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/host-operator
    inbox: agent:ws/host-operator
  input:
    message_id: 01JGT0XD000000000000000001
    from: agent:ws/host-operator
    on_behalf_of: human:operator
    authority: delegation-7
    to: agent:box/worker
    kind: note
    thread: 01JGT0XD000000000000000001
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: 01JGT0XD000000000000000001
    body: Build 512 is green.
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0XD000000000000000001
      to: agent:box/worker
      from: agent:ws/host-operator
      thread: 01JGT0XD000000000000000001
      kind: note
- at: '2026-01-05T09:02:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/host-operator
    inbox: agent:ws/host-operator
  input:
    message_id: 01JGT0XD000000000000000001
    from: agent:ws/host-operator
    on_behalf_of: human:operator
    authority: delegation-7
    to: agent:box/worker
    kind: note
    thread: 01JGT0XD000000000000000001
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: 01JGT0XD000000000000000001
    body: Build 512 is green.
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: duplicate
  error:
    name: inbox.messaging.Duplicate
  no_events:
  - inbox.messaging.MessagePosted
- at: '2026-01-05T09:03:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: human:operator
    inbox: human:operator
  input:
    message_id: 01JGT0XD000000000000000001
    from: human:operator
    on_behalf_of: human:operator
    to: agent:box/worker
    kind: note
    thread: 01JGT0XD000000000000000001
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: 01JGT0XD000000000000000001
    body: Probe.
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: id-taken
  error:
    name: inbox.messaging.MessageIdTaken
  no_events:
  - inbox.messaging.MessagePosted
assert:
- view: inbox.messaging.Pending
  params:
    inbox: agent:box/worker
  counts:
    at_least: 1
    at_most: 1
- view: inbox.messaging.Pending
  params:
    inbox: agent:box/worker
  contains:
    message_id: 01JGT0XD000000000000000001
    from: agent:ws/host-operator
    on_behalf_of: human:operator
    body: Build 512 is green.
- view: inbox.messaging.Outbox
  params:
    sender: agent:ws/host-operator
  counts:
    at_least: 1
    at_most: 1
- view: inbox.messaging.Outbox
  params:
    sender: human:operator
  counts:
    at_most: 0
