type: ess-scenario/7
covers:
- inbox.messaging.Refuse/outcome/deadline-passed
domain: inbox.messaging
scenario: a-late-refusal-leaves-the-request-to-expire
summary: 'A refusal that arrives once the service''s clock has reached the request''s `expires` is refused
  and changes nothing: the expiry task then removes the request, and the sender is told it expired.'
timeline:
- at: '2026-01-05T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    address: agent:box/worker
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: agent:box/worker
- at: '2026-01-05T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0DV000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: request
    thread: 01JGT0DV000000000000000001
    reply_shape:
      shape: lines
      value: 1
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-05T10:00:00Z'
    dedup_key: 01JGT0DV000000000000000001
    body: Is build 512 green?
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0DV000000000000000001
      to: agent:box/worker
      from: agent:ws/planner
      thread: 01JGT0DV000000000000000001
      kind: request
- at: '2026-01-05T09:02:00Z'
  command: inbox.messaging.MarkRead
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    message_id: 01JGT0DV000000000000000001
  outcome: read
  events:
  - event: inbox.messaging.MessageRead
    payload:
      message_id: 01JGT0DV000000000000000001
- at: '2026-01-05T10:00:00Z'
  command: inbox.messaging.Refuse
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    message_id: 01JGT0DV000000000000000001
    reason: Outside this session's repository.
  outcome: deadline-passed
  error:
    name: inbox.messaging.Expired
  no_events:
  - inbox.messaging.MessageRefused
- at: '2026-01-05T10:00:01Z'
  command: inbox.messaging.Expire
  actor: inbox.messaging.Sweeper
  input:
    message_id: 01JGT0DV000000000000000001
    now: '2026-01-05T10:00:01Z'
    keep_until: '2026-01-06T10:00:01Z'
  outcome: expired
  events:
  - event: inbox.messaging.MessageExpired
    payload:
      message_id: 01JGT0DV000000000000000001
      to: agent:ws/planner
      thread: 01JGT0DV000000000000000001
assert:
- view: inbox.messaging.Unanswered
  params:
    inbox: agent:box/worker
  counts:
    at_most: 0
- view: inbox.messaging.Outbox
  params:
    sender: agent:ws/planner
  counts:
    at_most: 0
