- inbox.messaging.Answer/outcome/already-expired
- inbox.messaging.Answer/outcome/authority-invalid
- inbox.messaging.Answer/outcome/no-authority
- inbox.messaging.Answer/outcome/signature-invalid
domain: inbox.messaging
scenario: reply-envelope-is-checked
summary: 'The service checks a reply envelope as it checks a post: its lifetime, its signature and its
  authority. A refused reply leaves the request waiting for an answer.'
