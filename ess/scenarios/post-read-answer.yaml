type: ess-scenario/7
covers:
- inbox.messaging.Answer/outcome/answered
- inbox.messaging.MarkDelivered/outcome/delivered
- inbox.messaging.MarkRead/outcome/read
- inbox.messaging.Message/transition/answer/by/inbox.messaging.Answer/answered
- inbox.messaging.Message/transition/deliver/by/inbox.messaging.MarkDelivered/delivered
- inbox.messaging.Message/transition/read/by/inbox.messaging.MarkRead/read
domain: inbox.messaging
scenario: post-read-answer
summary: A request is posted to an open inbox, handed to the wake surface, read and answered. The answer
  waits on the request for the sender.
timeline:
- at: '2026-01-05T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    address: agent:box/worker
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: agent:box/worker
- at: '2026-01-05T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0PA000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: request
    thread: 01JGT0PA000000000000000001
    reply_shape:
      shape: lines
      value: 3
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: 01JGT0PA000000000000000001
    body: Which crate holds the retry rule?
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0PA000000000000000001
      to: agent:box/worker
      from: agent:ws/planner
      thread: 01JGT0PA000000000000000001
      kind: request
- at: '2026-01-05T09:02:00Z'
  command: inbox.messaging.MarkDelivered
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    message_id: 01JGT0PA000000000000000001
  outcome: delivered
  events:
  - event: inbox.messaging.MessageDelivered
    payload:
      message_id: 01JGT0PA000000000000000001
- at: '2026-01-05T09:03:00Z'
  command: inbox.messaging.MarkRead
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    message_id: 01JGT0PA000000000000000001
  outcome: read
  events:
  - event: inbox.messaging.MessageRead
    payload:
      message_id: 01JGT0PA000000000000000001
- at: '2026-01-05T09:04:00Z'
  command: inbox.messaging.Answer
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    in_reply_to: 01JGT0PA000000000000000001
    reply_id: 01JGT0PA000000000000000002
    from: agent:box/worker
    on_behalf_of: agent:box/worker
    created: '2026-01-05T09:05:00Z'
    expires: '2026-01-06T09:05:00Z'
    body: It is in the delivery module.
    signature:
      key_id: key-2
      value: c2lnbmF0dXJl
  outcome: answered
  events:
  - event: inbox.messaging.MessageAnswered
    payload:
      message_id: 01JGT0PA000000000000000001
      reply_id: 01JGT0PA000000000000000002
      to: agent:ws/planner
      thread: 01JGT0PA000000000000000001
assert:
- view: inbox.messaging.Pending
  params:
    inbox: agent:box/worker
  counts:
    at_most: 0
- view: inbox.messaging.Unanswered
  params:
    inbox: agent:box/worker
  counts:
    at_most: 0
- view: inbox.messaging.Settled
  params:
    sender: agent:ws/planner
  contains:
    message_id: 01JGT0PA000000000000000001
    state: Answered
    answered_by: principal
    expires: '2026-01-06T09:05:00Z'
- view: inbox.messaging.Replies
  params:
    thread: 01JGT0PA000000000000000001
  counts:
    at_least: 1
    at_most: 1
