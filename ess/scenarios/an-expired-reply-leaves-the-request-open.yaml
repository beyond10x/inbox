type: ess-scenario/7
covers:
- inbox.messaging.Answer/outcome/expired-on-arrival
domain: inbox.messaging
scenario: an-expired-reply-leaves-the-request-open
summary: 'A reply whose own `expires` the service''s clock has passed is refused and stored nowhere: the
  request stays read and unanswered, and the sender has nothing to collect.'
timeline:
- at: '2026-01-05T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    address: agent:box/worker
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: agent:box/worker
- at: '2026-01-05T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0DW000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: request
    thread: 01JGT0DW000000000000000001
    reply_shape:
      shape: lines
      value: 1
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-05T10:00:00Z'
    dedup_key: 01JGT0DW000000000000000001
    body: Is build 512 green?
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0DW000000000000000001
      to: agent:box/worker
      from: agent:ws/planner
      thread: 01JGT0DW000000000000000001
      kind: request
- at: '2026-01-05T09:02:00Z'
  command: inbox.messaging.MarkRead
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    message_id: 01JGT0DW000000000000000001
  outcome: read
  events:
  - event: inbox.messaging.MessageRead
    payload:
      message_id: 01JGT0DW000000000000000001
- at: '2026-01-05T09:30:00Z'
  command: inbox.messaging.Answer
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    in_reply_to: 01JGT0DW000000000000000001
    reply_id: 01JGT0DW000000000000000002
    from: agent:box/worker
    on_behalf_of: agent:box/worker
    created: '2026-01-05T09:10:00Z'
    expires: '2026-01-05T09:20:00Z'
    body: Green.
    signature:
      key_id: key-2
      value: c2lnbmF0dXJl
  outcome: expired-on-arrival
  error:
    name: inbox.messaging.AlreadyExpired
  no_events:
  - inbox.messaging.MessageAnswered
assert:
- view: inbox.messaging.Unanswered
  params:
    inbox: agent:box/worker
  contains:
    message_id: 01JGT0DW000000000000000001
    state: Read
    expires: '2026-01-05T10:00:00Z'
- view: inbox.messaging.Settled
  params:
    sender: agent:ws/planner
  counts:
    at_most: 0
