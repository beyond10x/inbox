type: ess-scenario/7
covers:
- inbox.messaging.Answer/outcome/deadline-passed
domain: inbox.messaging
scenario: a-late-answer-leaves-the-decision-to-silence
summary: 'An answer that arrives once the service''s clock has reached the decision''s `expires` is refused
  and changes nothing: the expiry task then decides the decision by silence.'
timeline:
- at: '2026-01-05T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: human:operator
    inbox: human:operator
  input:
    address: human:operator
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: human:operator
- at: '2026-01-05T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0DT000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: human:operator
    kind: decision
    thread: 01JGT0DT000000000000000001
    decision:
      options:
      - letter: A
        text: Ship the release today.
      - letter: B
        text: Hold the release until Monday.
      recommended_option: A
    default_on_silence: B
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-05T10:00:00Z'
    dedup_key: 01JGT0DT000000000000000001
    body: Ship release 4.2 today?
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0DT000000000000000001
      to: human:operator
      from: agent:ws/planner
      thread: 01JGT0DT000000000000000001
      kind: decision
- at: '2026-01-05T09:02:00Z'
  command: inbox.messaging.MarkDelivered
  actor: inbox.messaging.Client
  caller:
    principal: human:operator
    inbox: human:operator
  input:
    message_id: 01JGT0DT000000000000000001
  outcome: delivered
  events:
  - event: inbox.messaging.MessageDelivered
    payload:
      message_id: 01JGT0DT000000000000000001
- at: '2026-01-05T10:00:01Z'
  command: inbox.messaging.Answer
  actor: inbox.messaging.Client
  caller:
    principal: human:operator
    inbox: human:operator
  input:
    in_reply_to: 01JGT0DT000000000000000001
    reply_id: 01JGT0DT000000000000000002
    from: human:operator
    on_behalf_of: human:operator
    created: '2026-01-05T10:00:01Z'
    expires: '2026-01-06T10:00:01Z'
    option: A
    body: Ship it.
    signature:
      key_id: key-2
      value: c2lnbmF0dXJl
  outcome: deadline-passed
  error:
    name: inbox.messaging.Expired
  no_events:
  - inbox.messaging.MessageAnswered
- at: '2026-01-05T10:00:02Z'
  command: inbox.messaging.Expire
  actor: inbox.messaging.Sweeper
  input:
    message_id: 01JGT0DT000000000000000001
    now: '2026-01-05T10:00:02Z'
    keep_until: '2026-01-06T10:00:02Z'
  outcome: decided-on-silence
  events:
  - event: inbox.messaging.DecisionTakenOnSilence
    payload:
      message_id: 01JGT0DT000000000000000001
      to: agent:ws/planner
      thread: 01JGT0DT000000000000000001
assert:
- view: inbox.messaging.Settled
  params:
    sender: agent:ws/planner
  contains:
    message_id: 01JGT0DT000000000000000001
    state: Answered
    answered_by: silence
    decided_option: B
    expires: '2026-01-06T10:00:02Z'
- view: inbox.messaging.Replies
  params:
    thread: 01JGT0DT000000000000000001
  counts:
    at_least: 1
    at_most: 1
