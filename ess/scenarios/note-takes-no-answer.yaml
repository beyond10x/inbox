type: ess-scenario/7
covers:
- inbox.messaging.Answer/outcome/note
- inbox.messaging.Refuse/outcome/note
domain: inbox.messaging
scenario: note-takes-no-answer
summary: 'A note asks for nothing: an answer to it and a refusal of it are refused, and the note stays
  for its owner to read.'
timeline:
- at: '2026-01-05T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    address: agent:box/worker
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: agent:box/worker
- at: '2026-01-05T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0AN000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: note
    thread: 01JGT0AN000000000000000001
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: 01JGT0AN000000000000000001
    body: Build 512 is green.
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0AN000000000000000001
      to: agent:box/worker
      from: agent:ws/planner
      thread: 01JGT0AN000000000000000001
      kind: note
- at: '2026-01-05T09:02:00Z'
  command: inbox.messaging.Answer
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    in_reply_to: 01JGT0AN000000000000000001
    reply_id: 01JGT0AN000000000000000002
    from: agent:box/worker
    on_behalf_of: agent:box/worker
    created: '2026-01-05T09:05:00Z'
    expires: '2026-01-06T09:05:00Z'
    body: It is in the delivery module.
    signature:
      key_id: key-2
      value: c2lnbmF0dXJl
  outcome: note
  error:
    name: inbox.messaging.NotAnswerable
  no_events:
  - inbox.messaging.MessageAnswered
- at: '2026-01-05T09:03:00Z'
  command: inbox.messaging.Refuse
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    message_id: 01JGT0AN000000000000000001
    reason: Not for this session.
  outcome: note
  error:
    name: inbox.messaging.NotAnswerable
  no_events:
  - inbox.messaging.MessageRefused
assert:
- view: inbox.messaging.Pending
  params:
    inbox: agent:box/worker
  contains:
    message_id: 01JGT0AN000000000000000001
    state: Sent
    kind: note
