type: ess-scenario/7
covers:
- inbox.messaging.CloseInbox/outcome/already-closed
- inbox.messaging.OpenInbox/outcome/opened
domain: inbox.messaging
scenario: closed-inbox-refuses-posts
summary: A post to a closed inbox and a post to an address nobody opened are refused alike. The owner
  opens the inbox again and the next post is stored.
