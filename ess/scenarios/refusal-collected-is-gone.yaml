type: ess-scenario/7
domain: inbox.messaging
scenario: refusal-collected-is-gone
summary: The sender collects the refusal of its request; the message is handled by that and removed.
timeline:
- at: '2026-01-05T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    address: agent:box/worker
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: agent:box/worker
- at: '2026-01-05T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0RX000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: request
    thread: 01JGT0RX000000000000000001
    reply_shape:
      shape: lines
      value: 3
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: 01JGT0RX000000000000000001
    body: Build 512 is green.
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0RX000000000000000001
      to: agent:box/worker
      from: agent:ws/planner
      thread: 01JGT0RX000000000000000001
      kind: request
- at: '2026-01-05T09:02:00Z'
  command: inbox.messaging.Refuse
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    message_id: 01JGT0RX000000000000000001
    reason: Outside this session's repository.
  outcome: refused
  events:
  - event: inbox.messaging.MessageRefused
    payload:
      message_id: 01JGT0RX000000000000000001
      to: agent:ws/planner
      thread: 01JGT0RX000000000000000001
- at: '2026-01-05T09:03:00Z'
  command: inbox.messaging.Collect
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0RX000000000000000001
  outcome: collected
  events:
  - event: inbox.messaging.MessageHandled
    payload:
      message_id: 01JGT0RX000000000000000001
- at: '2026-01-05T09:04:00Z'
  command: inbox.messaging.Collect
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0RX000000000000000001
  outcome: unknown-message
  error:
    name: inbox.messaging.UnknownMessage
  no_events:
