type: ess-scenario/7
covers:
- inbox.messaging.Collect/outcome/not-settled
- inbox.messaging.Message/state/Refused/refuses/inbox.messaging.Answer
- inbox.messaging.Message/state/Refused/refuses/inbox.messaging.Expire
- inbox.messaging.Message/state/Refused/refuses/inbox.messaging.Refuse
- inbox.messaging.Message/state/Sent/refuses/inbox.messaging.Collect
- inbox.messaging.Message/transition/refuse/by/inbox.messaging.Refuse/refused
- inbox.messaging.Refuse/outcome/refused
domain: inbox.messaging
scenario: refused-message-waits-for-the-sender
summary: The owner of an inbox refuses a request and says why. The sender cannot collect before that;
  afterwards the refusal waits on the message, and an answer is refused because the message is settled.
timeline:
- at: '2026-01-05T09:00:00Z'
  command: inbox.messaging.OpenInbox
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    address: agent:box/worker
    adapter: claude_code
  outcome: opened
  events:
  - event: inbox.messaging.InboxOpened
    payload:
      address: agent:box/worker
- at: '2026-01-05T09:01:00Z'
  command: inbox.messaging.PostMessage
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0RC000000000000000001
    from: agent:ws/planner
    on_behalf_of: agent:ws/planner
    to: agent:box/worker
    kind: request
    thread: 01JGT0RC000000000000000001
    reply_shape:
      shape: lines
      value: 3
    created: '2026-01-05T09:00:00Z'
    expires: '2026-01-06T09:00:00Z'
    dedup_key: 01JGT0RC000000000000000001
    body: Build 512 is green.
    signature:
      key_id: key-1
      value: c2lnbmF0dXJl
  outcome: posted
  events:
  - event: inbox.messaging.MessagePosted
    payload:
      message_id: 01JGT0RC000000000000000001
      to: agent:box/worker
      from: agent:ws/planner
      thread: 01JGT0RC000000000000000001
      kind: request
- at: '2026-01-05T09:02:00Z'
  command: inbox.messaging.Collect
  actor: inbox.messaging.Client
  caller:
    principal: agent:ws/planner
    inbox: agent:ws/planner
  input:
    message_id: 01JGT0RC000000000000000001
  outcome: not-settled
  error:
    name: inbox.messaging.NotSettled
  no_events:
  - inbox.messaging.MessageHandled
- at: '2026-01-05T09:03:00Z'
  command: inbox.messaging.Refuse
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    message_id: 01JGT0RC000000000000000001
    reason: Outside this session's repository.
  outcome: refused
  events:
  - event: inbox.messaging.MessageRefused
    payload:
      message_id: 01JGT0RC000000000000000001
      to: agent:ws/planner
      thread: 01JGT0RC000000000000000001
- at: '2026-01-05T09:04:00Z'
  command: inbox.messaging.Answer
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    in_reply_to: 01JGT0RC000000000000000001
    reply_id: 01JGT0RC000000000000000002
    from: agent:box/worker
    on_behalf_of: agent:box/worker
    created: '2026-01-05T09:05:00Z'
    expires: '2026-01-06T09:05:00Z'
    body: It is in the delivery module.
    signature:
      key_id: key-2
      value: c2lnbmF0dXJl
  outcome: already-settled
  error:
    name: inbox.messaging.AlreadySettled
  no_events:
  - inbox.messaging.MessageAnswered
- at: '2026-01-05T09:05:00Z'
  command: inbox.messaging.Refuse
  actor: inbox.messaging.Client
  caller:
    principal: agent:box/worker
    inbox: agent:box/worker
  input:
    message_id: 01JGT0RC000000000000000001
    reason: Again.
  outcome: already-settled
  error:
    name: inbox.messaging.AlreadySettled
  no_events:
  - inbox.messaging.MessageRefused
- at: '2026-01-05T09:06:00Z'
  command: inbox.messaging.Expire
  actor: inbox.messaging.Sweeper
  input:
    message_id: 01JGT0RC000000000000000001
    now: '2026-01-05T10:00:00Z'
    keep_until: '2026-01-06T10:00:00Z'
  outcome: not-due
  error:
    name: inbox.messaging.NotDue
  no_events:
  - inbox.messaging.MessageExpired
  - inbox.messaging.DecisionTakenOnSilence
assert:
- view: inbox.messaging.Settled
  params:
    sender: agent:ws/planner
  contains:
    message_id: 01JGT0RC000000000000000001
    state: Refused
    refusal: Outside this session's repository.
- view: inbox.messaging.Pending
  params:
    inbox: agent:box/worker
  counts:
    at_most: 0
- view: inbox.messaging.Replies
  params:
    thread: 01JGT0RC000000000000000001
  counts:
    at_most: 0
