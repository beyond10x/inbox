type: ess-scenario/7
covers:
- inbox.messaging.MarkDelivered/outcome/already-delivered
- inbox.messaging.MarkRead/outcome/already-read
- inbox.messaging.Message/state/Delivered/refuses/inbox.messaging.Collect
- inbox.messaging.Message/state/Read/refuses/inbox.messaging.Collect
domain: inbox.messaging
scenario: marks-repeat-without-effect
summary: An adapter that reports a delivery twice and an owner that reads twice change nothing the second
  time, and a delivery reported after the read does not take the message back.
