version: '3'

set: [pipefail]

vars:
  OUT: '{{.ROOT_DIR}}/.out'

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: The gate. Validate ess/, check the scenario files of ess/scenarios/ and hold ess/ess-inputs.yaml to them, the landing page's animation data to ess/ and generated/ to ess/, fail on a generated scenario no authored scenario covers, run the conformance suite on the interpreted target, against inbox-core and against a running inbox serve, run the 6 acceptance checks, then format, lint, test and build the Rust workspace and the generated crate.
    cmds:
      - task: spec
      - task: scenarios-drift
      - task: animation-drift
      - task: docs-words
      - task: gate-paths
      - task: projections-drift
      - task: drift
      - task: coverage
      - task: conform-interpreted
      - task: conform
      - task: acceptance
      - cargo fmt --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - task: test
      - task: build-generated

  test:
    desc: The test step of task check. Build the test binaries of the workspace (cargo nextest run --no-run, outside the bound) and make the synthesis of the unchanged ess/ the inbox-xtask cases read (one case, outside the bound; a cache under target/tmp/synthesis), then run them with cargo-nextest under tools/test-step.sh. A test that runs over 60 s is killed and fails (.config/nextest.toml); the run fails when it takes over 120 s; the 10 slowest tests are printed, pass or fail, from target/nextest/default/junit.xml.
    cmds:
      - cargo nextest run --workspace --locked --no-run
      - cargo nextest run -p inbox-xtask --locked -E 'test(=synthesis::the_entry_of_the_repository_is_made)'
      - sh tools/test-step.sh 120 '{{.ROOT_DIR}}/target/nextest/default/junit.xml' cargo nextest run --workspace --locked

  generate:
    desc: Rewrite generated/rust/inbox from a fresh synthesis of ess/; its Cargo.lock is kept and brought up to date.
    cmds:
      - cargo run -q --locked -p inbox-xtask -- generate
      - cargo metadata -q --format-version 1 --manifest-path generated/rust/inbox/Cargo.toml > /dev/null

  drift:
    desc: Fail when generated/rust/inbox differs from a fresh synthesis of ess/.
    cmds:
      - cargo run -q --locked -p inbox-xtask -- drift

  build-generated:
    desc: Build generated/rust/inbox with its server feature into the repository's target/.
    cmds:
      - cargo build --locked --manifest-path generated/rust/inbox/Cargo.toml --features server --target-dir '{{.ROOT_DIR}}/target'

  spec:
    desc: Validate the ESS specification, and fail with the file and line of each UNMAPPED marker in ess/.
    cmds:
      - ess specify validate --path ess --strict-requires
      - 'if grep -rn UNMAPPED ess; then echo "task spec: ess/ holds an UNMAPPED marker: express the rule, or make it an external: outcome listed in docs/design/inbox.md" >&2; exit 1; fi'

  projections:
    desc: Rewrite generated/openapi, generated/asyncapi, generated/schema and generated/docs from ess/.
    cmds:
      - for: [openapi, asyncapi, schema, docs]
        cmd: ess generate --path ess --kind {{.ITEM}} --out generated/{{.ITEM}}

  projections-drift:
    desc: Fail when generated/openapi, generated/asyncapi, generated/schema or generated/docs differs from ess/.
    cmds:
      - for: [openapi, asyncapi, schema, docs]
        cmd: ess generate --path ess --kind {{.ITEM}} --out generated/{{.ITEM}} --check

  conform-interpreted:
    desc: Run the suite task coverage writes on the ESS interpreted target; fails on a failed or errored scenario.
    cmds:
      - task: coverage
      - mkdir -p {{.OUT}}/conform
      - ess verify conform run --path ess --target interpreted --suite {{.OUT}}/coverage/suite.json --report-format 2 --report-out {{.OUT}}/conform/report.json

  conform:
    desc: Run the suite task coverage writes against inbox-core in process and against a running inbox serve over HTTP, write each report with ess, and fail unless each report is that suite's (digest, each scenario id once) and its implementation's, its counts add up, its conformance_status is a passing run's, no scenario failed, errored or was skipped, and the unsupported ones are exactly those its list names, each with the reason the run gave it in its results (crates/inbox-conformance/unsupported-core.tsv, crates/inbox-conformance/unsupported.tsv).
    vars:
      SUITE: '{{.OUT}}/coverage/suite.json'
      CORE: inbox-core
      SERVE: inbox-serve
      RUNNER: inbox-conformance@0.6.1
    cmds:
      - task: coverage
      - mkdir -p {{.OUT}}/conform
      - cargo build -q --locked -p inbox-cli -p inbox-conformance
      - '{{.ROOT_DIR}}/target/debug/inbox-conformance run --suite {{.SUITE}} --results {{.OUT}}/conform/core-results.json'
      - ess verify conform report --suite {{.SUITE}} --results {{.OUT}}/conform/core-results.json --implementation {{.CORE}} --runner {{.RUNNER}} --report-out {{.OUT}}/conform/core-report.json
      - '{{.ROOT_DIR}}/target/debug/inbox-conformance gate --suite {{.SUITE}} --report {{.OUT}}/conform/core-report.json --results {{.OUT}}/conform/core-results.json --unsupported crates/inbox-conformance/unsupported-core.tsv --implementation {{.CORE}}'
      - '{{.ROOT_DIR}}/target/debug/inbox-conformance run --target serve --inbox {{.ROOT_DIR}}/target/debug/inbox --suite {{.SUITE}} --results {{.OUT}}/conform/serve-results.json'
      - ess verify conform report --suite {{.SUITE}} --results {{.OUT}}/conform/serve-results.json --implementation {{.SERVE}} --runner {{.RUNNER}} --report-out {{.OUT}}/conform/serve-report.json
      - '{{.ROOT_DIR}}/target/debug/inbox-conformance gate --suite {{.SUITE}} --report {{.OUT}}/conform/serve-report.json --results {{.OUT}}/conform/serve-results.json --unsupported crates/inbox-conformance/unsupported.tsv --implementation {{.SERVE}}'

  acceptance:
    desc: Build the inbox binary and run the 6 checks of tests/acceptance against it (the ignored cases of the module checks of the test binary main, run by cargo-nextest with INBOX_BIN naming the binary, each killed at 60 s); fails when a check fails or fewer than 6 passed. Log in .out/acceptance/test.log.
    cmds:
      - mkdir -p {{.OUT}}/acceptance
      - cargo build -q --locked -p inbox-cli
      - >-
        INBOX_BIN='{{.ROOT_DIR}}/target/debug/inbox' cargo nextest run --locked -p inbox-acceptance --run-ignored only -E 'test(/^checks::/)' 2>&1 | tee {{.OUT}}/acceptance/test.log
      - >-
        awk '$1 == "PASS" {n += 1} END {print "task acceptance:", n + 0, "checks passed"; if (n < 6) {print "task acceptance: fewer than 6 checks passed"; exit 1}}' {{.OUT}}/acceptance/test.log

  coverage:
    desc: Synthesize with declared coverage into .out/coverage and fail on a generated scenario no authored scenario covers. The one suite conform-interpreted and conform run; synthesized once per task invocation.
    run: once
    cmds:
      - mkdir -p {{.OUT}}/coverage
      - ess verify conform synthesize --path ess --scenarios ess --suite-format 5 --out {{.OUT}}/coverage/suite.json

  scenarios:
    desc: Rewrite ess/ess-inputs.yaml from the scenario files of ess/scenarios/ (inbox-xtask scenarios), after their checks pass (one claimant per covered id, each claim of a type invariant at a view field resting on a row value, the scenario named as its file, a summary of at most 200 characters, message ids of 26 characters). A failed check changes no file.
    cmds:
      - cargo run -q --locked -p inbox-xtask -- scenarios

  scenarios-drift:
    desc: Run the checks of task scenarios and fail when ess/ess-inputs.yaml does not list each scenario file of ess/scenarios/ once, one line per path (edited, missing, not in the manifest); writes nothing.
    cmds:
      - cargo run -q --locked -p inbox-xtask -- scenarios --check

  animation:
    desc: Rewrite website/src/generated/animation.json, the data of the landing page's hero figure and slides, from the compiled ess/ (inbox-xtask animation), after its checks pass.
    cmds:
      - cargo run -q --locked -p inbox-xtask -- animation

  cli-reference:
    desc: Rewrite generated/cli/inbox.json, the reference document of the command line, from the clap definition of crates/inbox-cli. cargo test fails when the file differs (the_cli_reference_document_is_current).
    cmds:
      - INBOX_WRITE_CLI_REFERENCE=1 cargo test -q --locked -p inbox-cli the_cli_reference_document_is_current

  docs-words:
    desc: Fail with the matching lines when an end-user page (website/docs, website/product.json) names a wave, a stage, a story, an epic or a count of scenarios (inbox-xtask docs-words); those belong in docs/checks.md. Writes nothing.
    cmds:
      - cargo run -q --locked -p inbox-xtask -- docs-words website/docs website/product.json

  gate-paths:
    desc: Hold the path decision of the CI job (tools/gate-paths.sh, a POSIX shell script that answers skip when a change holds only planning or prose files) to its 12 cases. Writes nothing.
    cmds:
      - sh tools/gate-paths.sh --test

  animation-drift:
    desc: Fail when website/src/generated/animation.json differs from what inbox-xtask animation writes from the compiled ess/ (edited, missing); writes nothing.
    cmds:
      - cargo run -q --locked -p inbox-xtask -- animation --check

  plan:
    desc: Validate the AEP planning store.
    cmds:
      - aep plan artifact validate
